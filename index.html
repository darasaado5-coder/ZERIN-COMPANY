<title>Zerin Company</title>
<style>
:root{
  --bg:#f3f6f4; --text:#14231c; --muted:#5a6b62; --brand:#0f3d2e;
  --fb:#1877f2; --wa:#1faa59; --on:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1713; --text:#eef4f0; --muted:#9bb0a4; --brand:#d8b66a;}
}
:root[data-theme="dark"]{--bg:#0f1713; --text:#eef4f0; --muted:#9bb0a4; --brand:#d8b66a;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:"Cairo","Segoe UI",Tahoma,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
main{width:100%; max-width:420px; text-align:center}
.brand{margin-bottom:36px}
.logo{display:block; width:280px; max-width:100%; height:auto; margin:0 auto 22px; color:var(--brand); stroke:currentColor; stroke-width:1.6; stroke-linecap:round; fill:none}
.brand h1{font-family:"Cinzel","Times New Roman",serif; font-weight:700; font-size:clamp(2.6rem,14vw,3.6rem); letter-spacing:.22em; padding-inline-start:.22em; margin:0; line-height:1.1; color:var(--brand)}
.rule{display:flex; align-items:center; gap:12px; max-width:260px; margin:14px auto 12px}
.rule::before,.rule::after{content:""; flex:1; height:1px; background:var(--brand); opacity:.6}
.rule i{width:7px; height:7px; background:var(--brand); transform:rotate(45deg)}
.brand span{display:block; font-family:"Cinzel","Times New Roman",serif; font-weight:400; font-size:1rem; letter-spacing:.7em; padding-inline-start:.7em}
.desc{margin:0 0 8px; color:var(--muted); font-size:.95rem}
p{margin:0 0 32px; color:var(--muted); font-size:1.05rem}
a.btn{
  display:flex; align-items:center; justify-content:center; gap:12px;
  padding:18px 20px; margin-bottom:8px; border-radius:16px;
  color:var(--on); text-decoration:none; font-size:1.2rem; font-weight:700;
  transition:transform .15s ease, opacity .15s ease;
}
a.btn:hover{opacity:.92; transform:translateY(-1px)}
a.btn:focus-visible{outline:3px solid var(--text); outline-offset:3px}
a.btn:active{transform:scale(.98)}
.phone{display:block; font-size:.85rem; color:var(--muted); margin-bottom:16px; font-weight:600}
.fb{background:var(--fb)} .wa{background:var(--wa)}
svg{width:26px; height:26px; fill:currentColor}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Cinzel:wght@400;700&display=swap">
