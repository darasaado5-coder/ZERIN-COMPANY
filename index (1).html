<html lang="ar" dir="rtl">

<meta charset="utf-8">

<title>ZERIN COMPANY</title>
<meta name="description" content="تواصل مع شركة زيرين — أفضل الخدمات بجودة عالية عبر واتساب وفيسبوك.">
<meta name="theme-color" content="#1c140e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍳%3C/text%3E%3C/svg%3E">

<style>
:root{--font-display:"Cormorant Garamond","Times New Roman",serif;--font-sans:"Cairo",system-ui,sans-serif;--ink:#1c140e;--ivory:#fffdf8;--gold:#c6a15a;--gold-soft:#e8d7a8;--wa:#22c55e;--wa-deep:#16a34a;--fb:#1877f2;--fb-deep:#0b63d0;--sheet:#fff;--line:#efe6d6;--pill:1.85rem}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);background:var(--ink);color:var(--ivory)}
button:not(:disabled){cursor:pointer}
.kitchen{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}
.veil{position:fixed;inset:0;background:linear-gradient(180deg,rgb(28 18 10/.18) 0%,rgb(28 18 10/.02) 26%,rgb(16 10 6/.42) 58%,rgb(8 5 3/.78) 100%);pointer-events:none}
.stage{position:relative;z-index:1;display:flex;min-height:100dvh;width:min(100%,28rem);margin-inline:auto;flex-direction:column;padding:calc(.7rem + env(safe-area-inset-top,0px)) .85rem calc(1.15rem + env(safe-area-inset-bottom,0px))}
.topbar{direction:ltr;position:relative;display:flex;align-items:center;justify-content:space-between;min-height:4.5rem;padding:.35rem .45rem;border-radius:1.85rem;background:var(--sheet);color:var(--ink);box-shadow:0 12px 32px rgb(20 12 8/.18)}
.top-actions{position:relative;display:flex;align-items:center;gap:.15rem}
.topbar-title{position:absolute;left:50%;top:50%;translate:-50% -50%;margin:0;width:max-content;text-align:center;font-size:1.45rem;font-weight:800}
.icon-btn{display:grid;width:2.75rem;height:2.75rem;place-items:center;border:0;border-radius:999px;background:transparent;color:var(--ink)}
.icon-btn:hover,.menu-item:hover{background:var(--line)}
.icon-btn:focus-visible,.contact-btn:focus-visible,.menu-item:focus-visible,.reopen:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brand{margin-top:16vh;text-align:center;text-shadow:0 2px 18px rgb(0 0 0/.35)}
.brand-word{margin:0;font-family:var(--font-display);font-size:clamp(3.1rem,12vw,4.1rem);font-weight:500;letter-spacing:.34em;line-height:.9;padding-inline-start:.34em}
.brand-rule{display:flex;align-items:center;justify-content:center;gap:.7rem;margin:.55rem 0 .15rem}
.brand-rule span{width:4.25rem;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent)}
.brand-rule i{width:.42rem;height:.42rem;background:var(--gold);transform:rotate(45deg)}
.brand-sub{margin:0;color:var(--gold-soft);font-family:var(--font-display);font-size:.95rem;font-weight:600;letter-spacing:.62em;padding-inline-start:.62em}
.sheet{margin-top:auto;display:flex;flex-direction:column;gap:.85rem;text-align:center}
.lead,.hint{margin:0;font-weight:600;text-shadow:0 2px 12px rgb(0 0 0/.45)}
.lead{font-size:1.2rem}
.ask{margin:.15rem 0 0;font-size:clamp(2.5rem,10vw,3.15rem);font-weight:800;line-height:1.15;text-shadow:0 3px 16px rgb(0 0 0/.4)}
.hint{font-size:1.05rem;font-weight:500;opacity:.92}
.contact-btn{display:flex;align-items:center;justify-content:center;gap:.85rem;min-height:4.6rem;padding:.7rem 1.35rem;border-radius:var(--pill);color:var(--ivory);text-decoration:none;box-shadow:0 10px 24px rgb(0 0 0/.22);transition:transform .16s ease,filter .16s ease}
.contact-btn:hover{filter:brightness(1.05)}
.contact-btn:active{transform:scale(.985)}
.wa{background:linear-gradient(180deg,color-mix(in srgb,var(--wa) 72%,white) 0%,var(--wa) 42%,var(--wa-deep) 100%)}
.fb{background:linear-gradient(180deg,color-mix(in srgb,var(--fb) 78%,white) 0%,var(--fb) 45%,var(--fb-deep) 100%);min-height:4.35rem}
.wa-copy,.fb-copy{display:flex;flex-direction:column;align-items:center;line-height:1.25}
.btn-title{font-size:1.35rem;font-weight:800}
.btn-num{font-size:.95rem;font-weight:600;letter-spacing:.04em;opacity:.95}
.menu{position:absolute;top:3.3rem;left:0;z-index:5;width:13.5rem;overflow:hidden;border-radius:1.1rem;background:var(--sheet);color:var(--ink);box-shadow:0 16px 40px rgb(20 12 8/.22)}
.menu-item{display:flex;width:100%;min-height:2.85rem;align-items:center;gap:.6rem;padding:.55rem .9rem;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;text-align:start;text-decoration:none}
.toast{position:absolute;top:4.85rem;left:50%;z-index:6;translate:-50% 0;border-radius:999px;background:var(--ink);color:var(--ivory);padding:.45rem .9rem;font-size:.85rem;font-weight:600;box-shadow:0 8px 24px rgb(0 0 0/.25)}
.reopen{margin-top:auto;margin-bottom:1.5rem;align-self:center;min-height:3.25rem;padding:.7rem 1.6rem;border:0;border-radius:999px;background:var(--sheet);color:var(--ink);font:inherit;font-size:1.05rem;font-weight:800;box-shadow:0 10px 28px rgb(0 0 0/.25)}
.sheet-in{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.sheet-in,.contact-btn{animation:none;transition:none}}
[hidden]{display:none!important}
</style>
</head>
